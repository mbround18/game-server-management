name: Docker Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - README.md
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  rust:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # de0fac2, https://github.com/actions/checkout/releases/latest

      - name: Install paws
        uses: mbround18/paws/actions/paws-up@1315105b98074f2dbde6b16615d1219dbfe4a0f6 # v0.0.1-prerelease.36, https://github.com/mbround18/paws/releases/latest

      - name: Rust CI (build, test, clippy, rustfmt)
        run: paws ci --toolchain rust

  publish-crates:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      # crates.io needs a path-dependency's crate to already be published
      # before a dependent can publish against it, so this list is ordered
      # leaves-first (gsm-shared/ini-derive before gsm-cron/gsm-mod-manager/
      # gsm-notifications/gsm-serde, which depend on them). max-parallel: 1
      # makes the matrix walk that order instead of firing every publish at
      # once, which also avoids slamming crates.io's new-crate rate limit.
      fail-fast: true
      max-parallel: 1
      matrix:
        source:
          - libs/env-parse
          - libs/gsm-backup
          - libs/gsm-instance
          - libs/gsm-monitor
          - libs/gsm-shared
          - libs/gsm-serde-derive
          - libs/gsm-cron
          - libs/gsm-mod-manager
          - libs/gsm-notifications
          - libs/gsm-serde
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # de0fac2, https://github.com/actions/checkout/releases/latest

      - name: Install paws
        uses: mbround18/paws/actions/paws-up@1315105b98074f2dbde6b16615d1219dbfe4a0f6 # v0.0.1-prerelease.36, https://github.com/mbround18/paws/releases/latest

      - name: Publish crate
        run: paws publish --target rust-crate --source ${{ matrix.source }} --registry crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  docker-compose:
    needs:
      - rust
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # de0fac2, https://github.com/actions/checkout/releases/latest

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # 4907a6d, https://github.com/docker/login-action/releases/latest
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set VERSION from tag or use latest
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="latest"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build images from compose
        run: |
          docker compose -f compose.yml build
        env:
          VERSION: ${{ env.VERSION }}

      - name: Push images to registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker compose -f compose.yml push
        env:
          VERSION: ${{ env.VERSION }}
