name: PR Pipelines

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # de0fac2, https://github.com/actions/checkout/releases/latest

      - name: Install paws
        uses: mbround18/paws/actions/paws-up@4153674cfa0d264290c5bfe65e02dfc542efc834 # v0.0.1-prerelease.42, https://github.com/mbround18/paws/releases/latest

      - name: Rust CI (build, test, clippy, rustfmt)
        run: paws ci --toolchain rust

  audit:
    runs-on: ubuntu-latest
    needs:
      - rust-build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # de0fac2, https://github.com/actions/checkout/releases/latest
        with:
          fetch-depth: 0

      - name: Install paws
        uses: mbround18/paws/actions/paws-up@4153674cfa0d264290c5bfe65e02dfc542efc834 # v0.0.1-prerelease.42, https://github.com/mbround18/paws/releases/latest

      - name: Audit (semgrep + gitleaks)
        run: paws audit
