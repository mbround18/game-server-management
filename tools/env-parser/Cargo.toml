[package]
name = "env-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://gsm.boop.ninja/env_parser/index.html"
description = "Internal CLI that renders config templates from environment variables for the GSM Docker images."

[[bin]]
name = "env-parser"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
tera = "2.0.0"
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"

[lints]
workspace = true
