[package]
name = "gsm-cron"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://gsm.boop.ninja/gsm_cron/index.html"
description = "An async cron-like job scheduler for running game server maintenance tasks (updates, backups, restarts) on a schedule."

[dependencies]
tracing = "0"
cron = "0"
chrono = "0.4.45"
tokio = { version = "1.52.4", features = ["macros", "rt", "time"] }
gsm-shared = { path = "../gsm-shared", version = "0.1.0" }
nix = { version = "0.31.3", features = ["signal"] }

[lints]
workspace = true
