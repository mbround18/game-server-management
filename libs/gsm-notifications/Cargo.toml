[package]
name = "gsm-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://gsm.boop.ninja/gsm_notifications/index.html"
description = "Dispatches notifications to a webhook URL, with native Discord embed support."

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
gsm-shared = { path = "../gsm-shared", version = "0.1.0" }
tracing = "0"

[lints]
workspace = true
