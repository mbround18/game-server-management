[package]
name = "gsm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://gsm.boop.ninja/gsm_cli/index.html"
description = "Command-line interface for installing and managing generic SteamCMD-based game server instances."

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
gsm-instance = { path = "../../libs/gsm-instance" }
gsm-cron = { path = "../../libs/gsm-cron" }
gsm-monitor = { path = "../../libs/gsm-monitor" }
gsm-shared = { path = "../../libs/gsm-shared" }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
