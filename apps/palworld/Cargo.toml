[package]
name = "palworld"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/mbround18/palworld-docker"
homepage.workspace = true
documentation = "https://gsm.boop.ninja/palworld/index.html"
description = "Dockerized Palworld dedicated server launcher built on the Game Server Management (GSM) toolkit."

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
gsm-instance = {path = "../../libs/gsm-instance"}
gsm-cron = {path = "../../libs/gsm-cron"}
gsm-shared = {path = "../../libs/gsm-shared"}
gsm-monitor = {path = "../../libs/gsm-monitor"}
gsm-notifications = {path ="../../libs/gsm-notifications"}
gsm-mod-manager = {path = "../../libs/gsm-mod-manager"}
env-parse = {path = "../../libs/env-parse"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
gsm-serde = {path = "../../libs/gsm-serde"}
gsm-serde-derive = {path = "../../libs/gsm-serde-derive"}
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros"] }
regex = "1.13.1"
serde_plain = "1"
lazy_static = "1.5.0"

[lints]
workspace = true
